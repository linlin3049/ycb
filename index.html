<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>遗传病风险推测</title>
  <style>
    body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;background:#f4f7fb;margin:0;padding:20px;color:#0f172a}
    .wrap{max-width:960px;margin:0 auto;display:grid;gap:16px}
    .card{background:#fff;border:1px solid #dbe4f6;border-radius:14px;padding:16px}
    h2{margin:0 0 10px}
    .row{display:flex;gap:10px;flex-wrap:wrap}
    input,select,button{font-size:16px;padding:10px;border-radius:10px;border:1px solid #cfd8ea}
    button{cursor:pointer}
    .primary{background:#2563eb;color:#fff;border:none}
    .members{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
    .chip{padding:8px;border:1px solid #d6deef;border-radius:10px;background:#fff;text-align:center}
    .list{margin-top:10px;border:1px dashed #c9d6ef;border-radius:10px;padding:10px;min-height:60px}
    .hidden{display:none}
    .modal{position:fixed;inset:0;background:rgba(2,6,23,.45);display:none;align-items:center;justify-content:center}
    .dialog{background:#fff;border-radius:12px;padding:16px;min-width:300px}
    .dialog .row{justify-content:flex-end;margin-top:12px}
  </style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <h2>1）选择遗传病</h2>
    <div class="row">
      <select id="diseaseSelect"></select>
      <input id="newDisease" placeholder="新增遗传病名称" />
      <button id="addDisease">添加遗传病</button>
    </div>
  </div>

  <div class="card">
    <h2>2）添加家庭成员</h2>
    <div class="members" id="memberBtns"></div>
    <div class="list" id="memberList">暂无成员数据</div>
  </div>

  <div class="card">
    <div class="row">
      <button class="primary" id="calcBtn">计算患病风险</button>
      <button id="resetBtn">重置</button>
    </div>
  </div>

  <div class="card hidden" id="resultCard">
    <h2>评估结果</h2>
    <p>遗传病：<b id="rDisease"></b></p>
    <p>样本成员数：<b id="rCount"></b></p>
    <p>患病人数：<b id="rIll"></b>，健康人数：<b id="rHealthy"></b></p>
    <p>演示风险值：<b id="rRisk"></b></p>
    <p style="color:#64748b">说明：当前为交互演示版；你后续可替换为严格贝叶斯计算核心。</p>
  </div>
</div>

<div class="modal" id="statusModal">
  <div class="dialog">
    <h3 id="modalTitle">选择健康状态</h3>
    <div class="row" style="justify-content:flex-start">
      <button data-status="患病" class="primary statusBtn">患病</button>
      <button data-status="健康" class="statusBtn">健康</button>
    </div>
    <div class="row"><button id="cancelModal">取消</button></div>
  </div>
</div>

<script>
const diseases = ["神经纤维瘤病","血友病","地中海贫血"];
const relationPool = ["爷爷","奶奶","外公","外婆","父亲","母亲","伯伯","叔叔","舅舅","姑姑","儿子","女儿"];
const members = [];
let pendingRelation = "";

const diseaseSelect = document.getElementById("diseaseSelect");
const memberBtns = document.getElementById("memberBtns");
const memberList = document.getElementById("memberList");
const modal = document.getElementById("statusModal");
const modalTitle = document.getElementById("modalTitle");

function renderDiseases(){
  diseaseSelect.innerHTML = diseases.map(d=>`<option value="${d}">${d}</option>`).join("");
}
function renderMemberBtns(){
  memberBtns.innerHTML = relationPool.map(r=>`<button class="chip" data-relation="${r}">+ ${r}</button>`).join("");
  memberBtns.querySelectorAll("button").forEach(btn=>{
    btn.onclick=()=>{
      pendingRelation = btn.dataset.relation;
      modalTitle.textContent = `请选择 ${pendingRelation} 的健康状态`;
      modal.style.display = "flex";
    };
  });
}
function renderMemberList(){
  if(!members.length){ memberList.textContent="暂无成员数据"; return; }
  memberList.innerHTML = members.map((m,i)=>`${i+1}. ${m.relation} - ${m.status}`).join("<br/>");
}

document.getElementById("addDisease").onclick=()=>{
  const name = document.getElementById("newDisease").value.trim();
  if(!name) return;
  if(!diseases.includes(name)) diseases.push(name);
  renderDiseases();
  diseaseSelect.value = name;
  document.getElementById("newDisease").value = "";
};

document.querySelectorAll(".statusBtn").forEach(btn=>{
  btn.onclick=()=>{
    members.push({relation: pendingRelation, status: btn.dataset.status});
    modal.style.display = "none";
    renderMemberList();
  }
});
document.getElementById("cancelModal").onclick=()=> modal.style.display="none";

document.getElementById("calcBtn").onclick=()=>{
  const resultCard = document.getElementById("resultCard");
  const ill = members.filter(m=>m.status==="患病").length;
  const healthy = members.filter(m=>m.status==="健康").length;
  const risk = members.length? ((ill/members.length)*100).toFixed(1)+"%":"0.0%";
  document.getElementById("rDisease").textContent = diseaseSelect.value;
  document.getElementById("rCount").textContent = members.length;
  document.getElementById("rIll").textContent = ill;
  document.getElementById("rHealthy").textContent = healthy;
  document.getElementById("rRisk").textContent = risk;
  resultCard.classList.remove("hidden");
};

document.getElementById("resetBtn").onclick=()=>{ members.length=0; renderMemberList(); document.getElementById("resultCard").classList.add("hidden"); };

renderDiseases();
renderMemberBtns();
renderMemberList();
</script>
</body>
</html>
